name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: The build must stay offline
        shell: pwsh
        run: |
          $bad = cargo tree -p vexus-app --target x86_64-pc-windows-msvc 2>&1 |
            Select-String -Pattern '\b(reqwest|hyper|ureq|curl|rustls|native-tls)\b'
          if ($bad) { $bad; throw 'A network client crate entered the dependency tree.' }

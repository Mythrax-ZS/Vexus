name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Installers and portable build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install the Tauri bundler
        run: cargo install tauri-cli --version "^2" --locked

      - name: Tests
        run: cargo test --workspace

      - name: Build NSIS + MSI installers
        run: cargo tauri build

      - name: Build the portable zip
        shell: pwsh
        run: ./scripts/package-portable.ps1 -SkipBuild

      - name: Checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem target/release/bundle/nsis/*.exe) +
                   @(Get-ChildItem target/release/bundle/msi/*.msi) +
                   @(Get-ChildItem dist/*.zip)
          $lines = foreach ($f in $files) {
            '{0}  {1}' -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name
          }
          Set-Content -Path dist/SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: vexus-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Vexus ${{ github.ref_name }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            dist/*.zip
            dist/SHA256SUMS.txt
